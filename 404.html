<style>
:root{--bg:#02040a;--emerald:#4ade80;--emerald-dim:#10b981;--ink:#e6edf3;--muted:#93a4b3;--line:rgba(74,222,128,0.14);}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;min-height:100vh;color:var(--ink);
  font-family:"Sora","Segoe UI",sans-serif;
  background:
    radial-gradient(circle at top,rgba(16,185,129,0.05),transparent 18%),
    radial-gradient(circle at 85% 15%,rgba(59,130,246,0.05),transparent 16%),
    linear-gradient(180deg,#04080e 0%,#03060b 28%,#02040a 62%,#010309 100%);
  background-attachment:fixed;}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:2;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.045) 2px,rgba(0,0,0,0.045) 4px);}
#matrix{position:fixed;inset:0;z-index:0;opacity:0.10;pointer-events:none;}
.page{position:relative;z-index:3;max-width:1080px;margin:0 auto;padding:0 20px;}
::selection{background:rgba(16,185,129,0.22);color:#fff;}
a{color:inherit;text-decoration:none;}
code,pre,.mono,time,.badge,.tag,.eyebrow,.nav,.toc{font-family:ui-monospace,"Monaco","Courier New",monospace;}

/* nav */
.nav{display:flex;align-items:center;justify-content:space-between;height:80px;}
.brand{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:0.32em;color:#7ee7a8;text-transform:uppercase;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--emerald);box-shadow:0 0 8px rgba(74,222,128,0.8);}
.navlinks{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:0.2em;text-transform:uppercase;}
.navlinks a{padding:8px 14px;border:1px solid transparent;border-radius:2px;color:rgba(203,213,225,0.7);transition:.2s;}
.navlinks a:hover{color:#bff3d0;border-color:rgba(74,222,128,0.18);background:rgba(255,255,255,0.03);}
.navlinks a.active{color:#bff3d0;border-color:rgba(74,222,128,0.28);background:rgba(74,222,128,0.07);}
.status{display:flex;align-items:center;gap:6px;color:rgba(126,231,168,0.55);font-size:11px;letter-spacing:0.26em;margin-left:6px;}

/* headings + layout */
.wrap{padding:32px 0 64px;}
.eyebrow{display:inline-block;border:1px solid var(--line);background:rgba(74,222,128,0.05);
  color:rgba(190,242,210,0.8);padding:8px 16px;border-radius:2px;font-size:12px;letter-spacing:0.28em;text-transform:uppercase;}
.page-title{font-size:52px;line-height:1.02;margin:20px 0 10px;font-weight:700;letter-spacing:-0.01em;}
.lede{color:var(--muted);font-size:18px;max-width:70ch;line-height:1.7;}
.dev-note{color:#fbbf24;letter-spacing:.1em;}

/* cards */
.cards{display:grid;grid-template-columns:1fr;gap:18px;margin-top:32px;}
@media(min-width:760px){.cards{grid-template-columns:1fr 1fr;}}
.card{display:block;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:22px;
  background:linear-gradient(160deg,rgba(255,255,255,0.045),rgba(255,255,255,0.012));
  transition:transform .25s,border-color .25s,box-shadow .25s;}
.card:hover{transform:translateY(-4px);border-color:rgba(74,222,128,0.28);
  box-shadow:0 14px 50px rgba(0,0,0,0.5),0 0 0 1px rgba(74,222,128,0.08);}
.card.is-draft{border-style:dashed;border-color:rgba(148,163,184,0.35);}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.card time{color:rgba(126,231,168,0.6);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;}
.card h2{font-size:20px;margin:6px 0 8px;line-height:1.25;}
.card p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 14px;}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.badge{font-size:10px;letter-spacing:0.16em;text-transform:uppercase;padding:4px 9px;border-radius:3px;border:1px solid;}
.badge.program{border-color:rgba(74,222,128,0.25);color:#9ae6b4;background:rgba(74,222,128,0.06);}
.badge.status{border-color:rgba(148,163,184,0.3);color:#cbd5e1;background:rgba(148,163,184,0.08);}
.badge.draft{border-color:rgba(251,191,36,0.5);color:#fbbf24;background:rgba(251,191,36,0.1);}
.sev-critical{border-color:rgba(248,113,113,0.45);color:#fca5a5;background:rgba(248,113,113,0.1);}
.sev-high{border-color:rgba(251,146,60,0.45);color:#fdba74;background:rgba(251,146,60,0.1);}
.sev-medium{border-color:rgba(251,191,36,0.45);color:#fcd34d;background:rgba(251,191,36,0.1);}
.sev-low{border-color:rgba(96,165,250,0.45);color:#93c5fd;background:rgba(96,165,250,0.1);}
.sev-info{border-color:rgba(148,163,184,0.4);color:#cbd5e1;background:rgba(148,163,184,0.09);}
.tags{display:flex;gap:6px;flex-wrap:wrap;}
.tag{font-size:11px;color:rgba(203,213,225,0.72);border:1px solid rgba(255,255,255,0.1);
  padding:3px 9px;border-radius:3px;background:linear-gradient(135deg,rgba(255,255,255,0.05),rgba(255,255,255,0.015));}
.empty{color:var(--muted);}

/* post */
.post .back{display:inline-block;color:rgba(126,231,168,0.7);font-size:12px;letter-spacing:0.16em;
  text-transform:uppercase;margin-bottom:18px;}
.post .back:hover{color:var(--emerald);}
.post-head h1{font-size:38px;line-height:1.1;margin:14px 0 12px;}
.post-head .meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;color:var(--muted);}
.post-head time{color:rgba(126,231,168,0.6);font-size:12px;letter-spacing:0.16em;text-transform:uppercase;}
.post-grid{display:grid;grid-template-columns:1fr;gap:28px;margin-top:28px;}
@media(min-width:900px){.post-grid{grid-template-columns:220px 1fr;}}
.toc{position:sticky;top:24px;align-self:start;border-left:1px solid var(--line);padding-left:16px;font-size:13px;}
.toc-title{color:rgba(126,231,168,0.6);text-transform:uppercase;letter-spacing:0.2em;font-size:11px;margin-bottom:10px;}
.toc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;}
.toc li.lvl3{padding-left:14px;}
.toc a{color:rgba(203,213,225,0.7);}
.toc a:hover{color:var(--emerald);}
@media(max-width:899px){.toc{position:static;border-left:none;padding-left:0;border-bottom:1px solid var(--line);padding-bottom:16px;}}

/* prose */
.prose{max-width:74ch;font-size:16px;line-height:1.75;color:#dbe4ec;}
.prose h2{font-size:26px;margin:36px 0 12px;padding-top:6px;color:#fff;letter-spacing:-0.01em;}
.prose h3{font-size:20px;margin:26px 0 10px;color:#eaf2f7;}
.prose h2 .header-anchor,.prose h3 .header-anchor{color:rgba(74,222,128,0.45);margin-right:8px;text-decoration:none;font-weight:400;}
.prose h2 .header-anchor:hover,.prose h3 .header-anchor:hover{color:var(--emerald);}
.prose p{margin:0 0 16px;}
.prose a{color:#7ee7a8;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(74,222,128,0.4);}
.prose a:hover{text-decoration-color:var(--emerald);}
.prose ul,.prose ol{padding-left:22px;margin:0 0 16px;}
.prose li{margin:6px 0;}
.prose strong{color:#fff;}
.prose blockquote{border-left:3px solid rgba(74,222,128,0.4);margin:18px 0;padding:6px 18px;
  background:rgba(74,222,128,0.04);color:#c8d4de;border-radius:0 6px 6px 0;}
.prose code{font-size:13.5px;background:rgba(148,163,184,0.14);padding:2px 6px;border-radius:4px;color:#e6edf3;}
.prose pre{margin:0 0 18px;padding:16px 18px;border-radius:10px;overflow-x:auto;
  border:1px solid rgba(74,222,128,0.14);background:#050a12;box-shadow:inset 0 1px 0 rgba(255,255,255,0.03);}
.prose pre code{background:none;padding:0;font-size:13.5px;line-height:1.6;color:#cfe8d6;}
.prose table{width:100%;border-collapse:collapse;margin:0 0 18px;font-size:14px;}
.prose th,.prose td{border:1px solid rgba(255,255,255,0.1);padding:8px 12px;text-align:left;}
.prose th{background:rgba(74,222,128,0.06);color:#bff3d0;}

/* highlight.js (emerald-tuned dark) */
.hljs{color:#cfe8d6;}
.hljs-comment,.hljs-quote{color:#5b7183;font-style:italic;}
.hljs-keyword,.hljs-selector-tag,.hljs-built_in,.hljs-name{color:#5eead4;}
.hljs-string,.hljs-attr,.hljs-template-tag{color:#86efac;}
.hljs-number,.hljs-literal,.hljs-variable,.hljs-symbol{color:#fbbf24;}
.hljs-title,.hljs-section,.hljs-function .hljs-title{color:#7dd3fc;}
.hljs-type,.hljs-class .hljs-title{color:#93c5fd;}
.hljs-meta,.hljs-tag{color:#94a3b8;}
.hljs-attribute{color:#fda4af;}
.hljs-deletion{color:#fca5a5;}
.hljs-addition{color:#86efac;}
.hljs-emphasis{font-style:italic;}
.hljs-strong{font-weight:700;}

/* banners */
.draft-banner{border:1px solid rgba(251,191,36,0.5);background:rgba(251,191,36,0.1);color:#fde68a;
  padding:12px 16px;border-radius:8px;margin-bottom:20px;font-size:13px;letter-spacing:0.04em;
  font-family:ui-monospace,monospace;}

/* 404 */
.notfound{min-height:60vh;}
.nf-links{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap;}
.btn{border:1px solid var(--emerald);color:#062012;background:var(--emerald);padding:11px 20px;border-radius:8px;
  font-weight:600;font-size:14px;}
.btn.ghost{background:transparent;color:#8ff0ad;border-color:rgba(74,222,128,0.5);}
.btn:hover{filter:brightness(1.05);}

/* footer */
.foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);
  padding:22px 0 30px;margin-top:20px;color:rgba(147,164,179,0.7);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;
  font-family:ui-monospace,monospace;}
.foot a:hover{color:var(--emerald);}
</style>

<script>(function(){
  var c=document.getElementById('matrix'); if(!c) return;
  var x=c.getContext('2d'); var fs=14, cols, drops;
  var glyphs='01<>[]{}/\\|=+-*ｱｶｻﾀﾅﾊﾏﾔﾗ0123456789ABCDEF'.split('');
  function resize(){ c.width=innerWidth; c.height=innerHeight; cols=Math.floor(c.width/fs); drops=Array(cols).fill(1); }
  resize(); addEventListener('resize',resize);
  function draw(){
    x.fillStyle='rgba(2,4,10,0.08)'; x.fillRect(0,0,c.width,c.height);
    x.fillStyle='rgba(74,222,128,0.45)'; x.font=fs+'px monospace';
    for(var i=0;i<drops.length;i++){
      var t=glyphs[Math.floor(Math.random()*glyphs.length)];
      x.fillText(t,i*fs,drops[i]*fs);
      if(drops[i]*fs>c.height && Math.random()>0.975) drops[i]=0;
      drops[i]++;
    }
  }
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce){ setInterval(draw, 60); } else { draw(); }
})();</script>
